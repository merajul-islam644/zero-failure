<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The CHOKRO mark: the app-icon tile — dark rounded plate, hairline
       blue frame, the ringed planet in neon (cyan into magenta). Same
       glyph as ChokroMark.tsx. -->
  <defs>
    <linearGradient id="chokro-neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56d9e6"/>
      <stop offset="1" stop-color="#f04ec1"/>
    </linearGradient>
  </defs>
  <!-- the plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1322" stroke="#42506b" stroke-width="2"/>
  <g stroke="url(#chokro-neon)" fill="none" stroke-linecap="round">
    <!-- halo pass: the neon glow -->
    <g opacity="0.3">
      <circle cx="32" cy="31.5" r="12.5" stroke-width="5.5"/>
      <ellipse cx="32" cy="33.5" rx="20" ry="6.4" stroke-width="4.5" transform="rotate(-16 32 33.5)"/>
    </g>
    <!-- crisp pass -->
    <circle cx="32" cy="31.5" r="12.5" stroke-width="3"/>
    <ellipse cx="32" cy="33.5" rx="20" ry="6.4" stroke-width="2.5" transform="rotate(-16 32 33.5)"/>
  </g>
</svg>
