server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # Baseline hardening, and the shell always revalidates so a new deploy
  # lands on the next navigation. (Deliberately no frame policy: host
  # tooling embeds the app legitimately — frame rules need a product call.)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control "no-cache" always;

  # Vite content-hashes everything under /assets — cache it forever, and
  # restate the security headers: an add_header in a location drops the
  # server-level ones.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
